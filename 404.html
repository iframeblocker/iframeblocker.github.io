<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Locked Browser</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#toolbar {
    height: 50px;
    display: flex;
    gap: 10px;
    padding: 10px;
    box-sizing: border-box;
    border-bottom: 1px solid #ccc;
}

#urlInput {
    flex: 1;
    padding: 8px;
    font-size: 16px;
}

#openBtn {
    padding: 8px 16px;
    cursor: pointer;
}

#frame {
    width: 100%;
    height: calc(100vh - 50px);
    border: none;
    display: none;
}

#message {
    padding: 20px;
}
</style>
</head>
<body>

<div id="toolbar">
    <input
        id="urlInput"
        type="text"
        placeholder="https://example.com"
    >
    <button id="openBtn">Open</button>
</div>

<iframe
    id="frame"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
></iframe>

<script>
const frame = document.getElementById("frame");
const input = document.getElementById("urlInput");
const button = document.getElementById("openBtn");

let allowedHost = null;

function normalizeUrl(url) {
    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }
    return url;
}

function openSite(url) {
    try {
        url = normalizeUrl(url);

        const parsed = new URL(url);

        allowedHost = parsed.hostname;

        frame.src = url;
        frame.style.display = "block";

        input.value = url;

        history.replaceState(
            {},
            "",
            "?url=" + encodeURIComponent(url)
        );

    } catch {
        alert("Invalid URL");
    }
}

button.addEventListener("click", () => {
    const url = input.value.trim();

    if (!url) {
        alert("Enter a URL");
        return;
    }

    openSite(url);
});

input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        button.click();
    }
});

setInterval(() => {
    if (!allowedHost) return;

    try {
        const currentHost =
            frame.contentWindow.location.hostname;

        if (
            currentHost &&
            currentHost !== allowedHost
        ) {
            console.warn(
                "Blocked navigation to:",
                currentHost
            );

            frame.contentWindow.history.back();
        }
    } catch (err) {
        // Most external websites become cross-origin.
        // Browser security prevents inspection.
    }
}, 500);

const initial =
    new URLSearchParams(location.search)
        .get("url");

if (initial) {
    openSite(initial);
}
</script>

</body>
</html>
