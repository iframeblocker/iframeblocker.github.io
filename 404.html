<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iframe blocker</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .bar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      padding: 6px 10px;
      font-size: 13px;
      color: white;
      background: rgba(0,0,0,0.6);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>

  <iframe id="frame"></iframe>

  <script>
    const rawPath = window.location.pathname.slice(1);
    const frame = document.getElementById("frame");
    const bar = document.getElementById("bar");

    if (!rawPath) {
      document.title = "404 Not Found";
      bar.innerText = "404 Not Found";
    } else {
      try {
        // decode raw input
        let decoded = decodeURIComponent(rawPath);

        // ensure protocol exists
        if (!decoded.startsWith("http://") && !decoded.startsWith("https://")) {
          decoded = "https://" + decoded;
        }

        // encode version for clean URL display
        const encoded = encodeURIComponent(decoded);

        // 🔥 THIS is what you asked for:
        // replace current page URL with encoded version
        window.history.replaceState({}, "", "/" + encoded);

        // load iframe
        frame.src = decoded;

        document.title = decoded;

      } catch (e) {
        document.title = "Error";
      }
    }
  </script>

</body>
</html>
