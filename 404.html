<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <iframe id="frame"></iframe>

  <script>
    const frame = document.getElementById("frame");

    let fullPath = window.location.href.split(window.location.host)[1];

    if (fullPath && fullPath !== "/") {
      try {
        fullPath = decodeURIComponent(fullPath.slice(1));

        if (!fullPath.startsWith("http://") && !fullPath.startsWith("https://")) {
          fullPath = "https://" + fullPath;
        }

        frame.src = fullPath;

        document.title = fullPath;

      } catch (e) {
        document.title = "Error";
      }
    } else {
      document.title = "404 Not Found";
    }
  </script>

</body>
</html>
