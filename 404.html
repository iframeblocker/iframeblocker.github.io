<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 Not Found</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .bar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 13px;
      padding: 6px 10px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>

  <div class="bar" id="bar">Loading...</div>
  <iframe id="frame"></iframe>

  <script>
    const raw = window.location.pathname.slice(1);
    const frame = document.getElementById("frame");
    const bar = document.getElementById("bar");

    if (!raw) {
      document.title = "404 Not Found";
      bar.innerText = "404 Not Found";
    } else {

      const decoded = decodeURIComponent(raw);

      let triedEncoded = false;

      function load(url) {
        bar.innerText = url;
        document.title = url;
        frame.src = url;
      }

      function tryFailover() {
        if (!triedEncoded) {
          triedEncoded = true;
          const encoded = encodeURIComponent(decoded);
          load(encoded);
        } else {
          bar.innerText = "Cannot load page";
          document.title = "Failed";
        }
      }

      // Attempt normal load first
      load(decoded);

      // If iframe fails to load, fallback after timeout
      setTimeout(() => {
        try {
          // If still blank or blocked, switch
          if (!frame.contentWindow || frame.contentWindow.length === 0) {
            tryFailover();
          }
        } catch (e) {
          tryFailover();
        }
      }, 1500);

    }
  </script>

</body>
</html>
