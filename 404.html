<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Locked Viewer</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#launcher {
    display: flex;
    gap: 10px;
    padding: 20px;
}

#urlInput {
    flex: 1;
    padding: 10px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
}

#frame {
    width: 100%;
    height: calc(100vh - 70px);
    border: none;
    display: none;
}
</style>
</head>
<body>

<div id="launcher">
    <input
        id="urlInput"
        type="text"
        placeholder="https://example.com"
    >
    <button onclick="openUrl()">Open</button>
</div>

<iframe
    id="frame"
    sandbox="allow-scripts allow-forms allow-same-origin"
></iframe>

<script>
let allowedHost = null;
const frame = document.getElementById("frame");

function normalizeUrl(url) {
    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }
    return url;
}

function loadTarget(url) {
    url = normalizeUrl(url);

    try {
        const parsed = new URL(url);

        allowedHost = parsed.hostname;

        frame.src = url;
        frame.style.display = "block";

        history.replaceState(
            {},
            "",
            "?url=" + encodeURIComponent(url)
        );

    } catch {
        alert("Invalid URL");
    }
}

function openUrl() {
    const url = document.getElementById("urlInput").value.trim();

    if (!url) {
        alert("Enter a URL");
        return;
    }

    loadTarget(url);
}

frame.addEventListener("load", () => {
    try {
        const current =
            frame.contentWindow.location.hostname;

        if (current !== allowedHost) {
            alert(
                "Navigation outside allowed domain blocked."
            );

            frame.src =
                new URLSearchParams(location.search)
                .get("url");
        }
    } catch (e) {
        // Cross-origin iframe.
        // Browser won't let us inspect it.
    }
});

const initial =
    new URLSearchParams(location.search).get("url");

if (initial) {
    document.getElementById("urlInput").value = initial;
    loadTarget(initial);
}
</script>

</body>
</html>
